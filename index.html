<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ByteMatch — Buy the right gear, set it up right</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
         margin: 0; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 1.7rem; margin: 8px 0 4px; }
  h1 .accent { color: #38bdf8; }
  .sub { color: #94a3b8; margin: 0 0 24px; font-size: .95rem; }
  .step { display: none; }
  .step.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
  .q { font-size: 1.25rem; font-weight: 700; margin: 0 0 16px; }
  .opt { display: block; width: 100%; text-align: left; background: #1e293b;
         border: 2px solid #334155; color: #e2e8f0; border-radius: 14px;
         padding: 16px; margin: 0 0 10px; font-size: 1rem; cursor: pointer; }
  .opt small { display: block; color: #94a3b8; margin-top: 4px; font-size: .82rem; }
  .opt:active { border-color: #38bdf8; background: #273449; }
  .back { background: none; border: none; color: #64748b; font-size: .9rem;
          margin-bottom: 12px; cursor: pointer; padding: 4px 0; }
  .progress { height: 6px; background: #1e293b; border-radius: 3px; margin-bottom: 20px; }
  .progress i { display: block; height: 100%; background: #38bdf8; border-radius: 3px;
                transition: width .3s; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px;
          padding: 16px; margin-bottom: 12px; }
  .card .rank { display: inline-block; background: #38bdf8; color: #0f172a;
                font-weight: 800; border-radius: 8px; padding: 2px 10px;
                font-size: .8rem; margin-bottom: 8px; }
  .card h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .card .price { color: #4ade80; font-weight: 800; font-size: 1.15rem; }
  .card .permo { color: #94a3b8; font-weight: 400; font-size: .82rem; }
  .sortrow { display: flex; gap: 8px; margin: 16px 0; }
  .sort { flex: 1; background: #1e293b; border: 2px solid #334155; color: #cbd5e1;
          border-radius: 12px; padding: 10px 4px; font-size: .82rem; cursor: pointer; }
  .sort.on { border-color: #38bdf8; color: #fff; background: #273449; }
  .sortrow.wrap { flex-wrap: wrap; }
  .sortrow.wrap .sort { flex: 1 1 42%; }
  .sortline { color: #94a3b8; font-size: .82rem; margin: -6px 0 12px; }
  .more { display: block; width: 100%; background: #1e293b; border: 2px solid #334155;
          color: #cbd5e1; border-radius: 14px; padding: 14px; font-size: .95rem;
          cursor: pointer; margin-bottom: 4px; }
  .card.combo { border: 2px solid #f59e0b; background: #1c1917; }
  .card.combo .rank { background: #f59e0b; }
  .stepnum { display: inline-flex; align-items: center; justify-content: center;
             width: 28px; height: 28px; border-radius: 50%; background: #38bdf8;
             color: #0f172a; font-weight: 800; font-size: .9rem; margin-right: 10px;
             flex-shrink: 0; }
  .gstep { display: flex; align-items: flex-start; background: #1e293b;
           border: 1px solid #334155; border-radius: 14px; padding: 14px;
           margin-bottom: 10px; }
  .gstep h3 { margin: 0 0 4px; font-size: 1rem; }
  .gstep p { margin: 0; color: #94a3b8; font-size: .88rem; }
  .have { background: #052e16; border: 1px solid #16a34a; border-radius: 12px;
          padding: 12px 14px; margin-bottom: 16px; font-size: .88rem; }
  .have strong { color: #4ade80; }
  .bignum { font-size: 1.3rem; font-weight: 800; color: #38bdf8; }
  .vid { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 14px;
         overflow: hidden; margin-bottom: 12px; background: #000; }
  .vid iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  .vid.soon { display: flex; align-items: center; justify-content: center;
              padding-bottom: 0; height: 120px; background: #1e293b;
              border: 1px dashed #475569; color: #64748b; font-size: .9rem; }
  .card .why { color: #cbd5e1; font-size: .9rem; margin: 8px 0 0; }
  .chips { margin: 8px 0 2px; }
  .chip { display: inline-block; background: #0f172a; border: 1px solid #334155;
          color: #cbd5e1; border-radius: 999px; padding: 3px 10px;
          font-size: .76rem; margin: 0 6px 6px 0; }
  .badge { display: inline-block; background: #7c3aed; color: #fff; font-weight: 700;
           border-radius: 999px; padding: 3px 10px; font-size: .76rem; margin: 0 6px 6px 0; }
  .badge.x86 { background: #334155; color: #cbd5e1; }
  .warnline { color: #fbbf24; font-size: .85rem; margin: 6px 0 0; }
  .setupbox { margin-top: 12px; border-top: 1px solid #334155; padding-top: 10px; }
  .setupbox summary { cursor: pointer; color: #38bdf8; font-weight: 700; font-size: .92rem; }
  .setupbox h4 { margin: 14px 0 6px; font-size: .95rem; }
  .setupbox .gstep { padding: 10px 12px; }
  .setupbox .gstep p { font-size: .84rem; }
  .setupbox ul { margin: 4px 0 8px; padding-left: 18px; color: #94a3b8; font-size: .85rem; }
  .setupbox ul.whylist li { color: #cbd5e1; margin-bottom: 5px; }
  .morebox { margin-top: 10px; border-top: 1px solid #334155; padding-top: 8px; }
  .morebox summary { cursor: pointer; color: #38bdf8; font-weight: 700; font-size: .88rem; }
  .morebox p { margin: 8px 0 0; color: #94a3b8; font-size: .85rem; }
  .diagram { margin: 10px 0 2px; }
  .diagram svg { display: block; width: 100%; height: auto; background: #0f172a;
                 border: 1px solid #334155; border-radius: 12px; }
  .diagram figcaption { color: #64748b; font-size: .75rem; margin-top: 6px; font-style: italic; }
  .phsoon { display: flex; align-items: center; justify-content: center; height: 84px;
            border: 1px dashed #475569; border-radius: 12px; background: #16202f;
            color: #64748b; font-size: .85rem; margin-bottom: 12px; }
  .stepfig { margin: 0 0 12px; }
  .stepfig img { display: block; width: 100%; height: auto; border-radius: 12px;
                 border: 1px solid #334155; }
  .discbtn { display: block; margin: 18px auto 0; background: none; border: none;
             color: #64748b; font-size: .8rem; cursor: pointer; text-decoration: underline; }
  .discbtn:hover { color: #94a3b8; }
  .setupcta { margin-top: 20px; border-color: #38bdf8 !important; }
  .picks-head { font-size: 1.15rem; font-weight: 700; margin: 22px 0 10px; }
  .card .blurb { color: #94a3b8; font-size: .85rem; margin: 4px 0 0; font-style: italic; }
  .savings { background: #052e16; border: 1px solid #16a34a; border-radius: 14px;
             padding: 16px; margin: 20px 0; }
  .savings strong { color: #4ade80; }
  .note { background: #1e293b; border-left: 3px solid #38bdf8; padding: 10px 14px;
          font-size: .85rem; color: #94a3b8; margin-bottom: 8px; border-radius: 0 8px 8px 0; }
  .restart { display: block; width: 100%; margin-top: 24px; background: #38bdf8;
             color: #0f172a; font-weight: 800; border: none; border-radius: 14px;
             padding: 16px; font-size: 1rem; cursor: pointer; }
  .buildstamp { text-align: center; color: #475569; font-size: .75rem; margin-top: 32px; }
  .loading { text-align: center; padding: 60px 0; color: #94a3b8; }
  .wizprog { color: #7dd3fc; font-size: .85rem; font-weight: 700; margin: 0 0 8px; }
  .wiznav { display: flex; gap: 10px; margin-top: 16px; }
  .wiznav .opt { flex: 1; text-align: center; margin: 0; }
  .wiznav .wiznext { border-color: #38bdf8; background: #273449; font-weight: 700; }
  .minput { display: block; width: 100%; background: #1e293b; border: 2px solid #334155;
            color: #e2e8f0; border-radius: 14px; padding: 14px 16px; font-size: 1rem;
            margin: 0 0 12px; outline: none; }
  .minput:focus { border-color: #38bdf8; }
  .buylinks { margin-top: 12px; }
  .buybtn { display: block; width: 100%; background: #16202f; border: 2px dashed #475569;
            color: #64748b; border-radius: 12px; padding: 12px; font-size: .9rem;
            cursor: not-allowed; }
  .pairbtn { display: block; width: 100%; margin-top: 12px; background: #16202f;
             border: 2px solid #38bdf8; color: #7dd3fc; border-radius: 12px;
             padding: 12px; font-size: .92rem; font-weight: 700; cursor: pointer; }
  .pairbtn:active { background: #273449; }
  .dockrole { display: inline-block; background: #334155; color: #cbd5e1;
              border-radius: 999px; padding: 3px 10px; font-size: .76rem;
              font-weight: 700; margin: 0 6px 6px 0; }
  #setupbtn-wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; text-align: right; }
  #setupbtn { background: none; border: none; color: #7dd3fc; font-size: .88rem;
              font-weight: 700; cursor: pointer; padding: 6px 0; }
  .savebtn { display: block; width: 100%; margin-top: 10px; background: #16202f;
             border: 2px solid #475569; color: #cbd5e1; border-radius: 12px;
             padding: 11px; font-size: .9rem; font-weight: 700; cursor: pointer; }
  .savebtn:active { background: #273449; }
  .setupline { margin: 6px 0; color: #e2e8f0; font-size: .95rem; }
  .setupactions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .printsheet { background: #ffffff; color: #0f172a; border-radius: 14px;
                padding: 22px; margin-top: 14px; text-align: left; }
  .printsheet h2 { color: #0f172a; margin-top: 0; }
  .printsheet p { margin: 8px 0; }
  @media print {
    #setupbtn-wrap, .discbtn, .buildstamp, .no-print { display: none !important; }
    body { background: #ffffff; }
    .printsheet { border-radius: 0; padding: 0; }
  }
  .orline { text-align: center; color: #64748b; font-size: .85rem; margin: 18px 0 10px; }
  .dots::after { content: ""; animation: dots 1s steps(3) infinite; }
  @keyframes dots { 0% { content: ""; } 33% { content: "."; } 66% { content: ".."; } 100% { content: "..."; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="home">
    <h1>Byte<span class="accent">Match</span></h1>
    <p class="sub">Buy the right gear — and set it up. Networking gear that kills the rental fee, plus laptops and desktops matched to how you'll actually use them.</p>
    <button class="opt" onclick="chooseFlow('buy')">🛒 Buy New Gear<small>Quick quiz → top picks matched to your home or how you'll use a laptop</small></button>
    <button class="opt" onclick="chooseFlow('setup')">🔧 Set Up New Gear<small>Already have the gear? Step-by-step setup guides</small></button>
  </div>
  <div id="flow-pick" style="display:none"></div>
  <div id="isp-pick" style="display:none"></div>
  <div id="quiz" style="display:none">
    <div class="progress"><i id="bar" style="width:20%"></i></div>
    <div id="steps"></div>
  </div>
  <div id="results" style="display:none"></div>
  <div id="guide" style="display:none"></div>
  <div id="pc-guide" style="display:none"></div>
  <div id="model-lookup" style="display:none"></div>
  <div id="pairing" style="display:none"></div>
  <div id="setup" style="display:none"></div>
  <div id="disclaimers" style="display:none"></div>
  <div id="setupbtn-wrap"><button id="setupbtn" onclick="openMySetup()">🧩 My Setup</button></div>
  <button class="discbtn" onclick="openDisclaimers()">Disclaimers</button>
  <p class="buildstamp">ByteMatch &middot; Build 2026-10-15.15 &middot; If a page looks outdated, read this stamp back to us</p>
</div>
<script>const stepsEl = document.getElementById('steps');
const bar = document.getElementById('bar');
const answers = {};
let isps = [];

// ------------------------------------------------------------- front door
// First screen: Buy New Gear / Set Up New Gear. Second: Internet / PC.
// Then route into the matching existing flow.
let flowType = 'buy';   // 'buy' | 'setup'
const SECTION_IDS = ['home', 'flow-pick', 'isp-pick', 'quiz', 'results', 'guide', 'pc-guide', 'model-lookup', 'pairing', 'setup', 'disclaimers'];
function hideAllSections() {
  SECTION_IDS.forEach(id => document.getElementById(id).style.display = 'none');
}
function chooseFlow(f) { flowType = f; renderFlowPick(); }
function renderFlowPick() {
  hideAllSections();
  const el = document.getElementById('flow-pick');
  el.style.display = 'block';
  const buying = flowType === 'buy';
  el.innerHTML = `<button class="back" onclick="backHome()">← Back</button>
    <p class="q">${buying ? 'What are you buying?' : 'What are you setting up?'}</p>
    <button class="opt" onclick="routeFlow('internet')">🌐 Internet<small>${buying ? 'Modems, routers & mesh — ditch the ISP rental fee' : 'Activate and set up your modem or router, step by step'}</small></button>
    <button class="opt" onclick="routeFlow('pc')">💻 PC<small>${buying ? "Laptops & desktops matched to how you'll actually use them" : 'First-boot walkthroughs, brand setup tools & kid setup'}</small></button>
    <p class="orline">— or —</p>
    <button class="opt" onclick="startModelLookup()">🔎 Know your model?<small>Type the name — or the model number off the box — and jump straight to it</small></button>`;
  window.scrollTo(0, 0);
}
function backToFlowPick() { renderFlowPick(); }
function routeFlow(kind) {
  if (flowType === 'buy') {
    if (kind === 'internet') startBuy(); else startLaptopBuy();
  } else {
    if (kind === 'internet') startSetup();
    else { guideBrand = null; startPcGuide(); }   // generic entry: no model context
  }
}

const QUESTIONS = [
  { key: 'isp', q: "Who's your internet provider?",
    opts: () => isps.map(i => ({ v: i.id, t: i.name,
      s: i.connection === 'fiber' ? 'Fiber' : i.connection === 'dsl' ? 'DSL' : 'Cable' })) },
  { key: 'speed_tier', q: "How fast is your internet?",
    opts: () => [
      { v: 'under100', t: 'Under 100 Mbps — Basic', s: 'Browsing, email, one person streaming' },
      { v: '100-300', t: '100–300 Mbps — Standard (most common)', s: 'HD streaming on a couple of TVs' },
      { v: '300-600', t: '300–600 Mbps — Fast', s: '4K streaming, gaming, working from home' },
      { v: '600-1000', t: '600 Mbps–1 Gbps — Gigabit', s: 'Big household, tons of devices at once' },
      { v: 'unsure', t: 'Not sure / still shopping', s: "We'll go with the most common plan" } ] },
  { key: 'rooms', q: "How many rooms?",
    opts: () => [
      { v: '1-2', t: '1 – 2 rooms' },
      { v: '3-4', t: '3 – 4 rooms' },
      { v: '5-6', t: '5 – 6 rooms' },
      { v: '7plus', t: '7+ rooms' } ] },
  { key: 'floors', q: "How many floors?",
    opts: () => [
      { v: '1', t: '1 floor' },
      { v: '2', t: '2 floors' },
      { v: '3plus', t: '3+ floors' } ] },
  { key: 'yard', q: "Want WiFi out in the yard?",
    opts: () => [
      { v: 'no', t: 'No, inside is fine' },
      { v: 'small', t: 'Small yard or patio', s: 'Grilling, porch sitting' },
      { v: 'large', t: 'Large yard', s: 'Kids playing, workshop, pool area' } ] },
  { key: 'garage', q: "Need WiFi in the garage?",
    opts: () => [
      { v: 'no', t: 'No' },
      { v: 'yes', t: 'Yes', s: 'Smart garage door, workshop, EV charger' } ] },
  { key: 'family_size', q: "How many people live there?",
    opts: () => [
      { v: '1', t: 'Just me' },
      { v: '2', t: '2 people' },
      { v: '3', t: '3 people' },
      { v: '4', t: '4 people' },
      { v: '5plus', t: '5+ people' } ] },
  { key: 'tvs', q: "How many TVs connect to WiFi?",
    opts: () => [
      { v: '0', t: 'None' },
      { v: '1', t: '1 TV' },
      { v: '2', t: '2 TVs' },
      { v: '3', t: '3 TVs' },
      { v: '4plus', t: '4+ TVs' } ] },
  { key: 'smart_home', q: "Smart home gadgets?",
    opts: () => [
      { v: 'none', t: 'None', s: 'Just phones, laptops, TVs' },
      { v: 'some', t: 'A few', s: 'Robot vacuum, smart speaker, doorbell' },
      { v: 'lots', t: 'Loaded', s: 'Lights, locks, cameras, the works' } ] },
  { key: 'setup', q: "How do you want your setup?",
    opts: () => [
      { v: 'combo', t: 'All-in-one box', s: 'Easiest to set up and manage — one box, one app. Tradeoff: when it\'s time to upgrade, you replace the whole thing.' },
      { v: 'separate', t: 'Separate modem + router', s: 'Most reliable, best performance. A bit more to manage, but you can upgrade each piece on its own.' },
      { v: 'one_piece', t: 'Just one piece', s: 'I only need to replace part of my setup' } ] },
  { key: 'which_piece', when: () => answers.setup === 'one_piece',
    q: "Which piece do you need?",
    opts: () => [
      { v: 'modem_only', t: 'Just a modem', s: 'I already have a router I like' },
      { v: 'router_only', t: 'Just a router', s: 'I already have a modem or gateway' } ] },
];
let step = 0;
function visible() { return QUESTIONS.filter(q => !q.when || q.when()); }
function render() {
  const V = visible();
  if (step > V.length - 1) step = V.length - 1;
  const Q = V[step];
  bar.style.width = ((step + 1) / (V.length + 1) * 100) + '%';
  let h = `<button class="back" onclick="${step === 0 ? 'backToFlowPick()' : 'back()'}">← Back</button>`;
  h += `<p class="q">${Q.q}</p>`;
  Q.opts().forEach(o => {
    h += `<button class="opt" onclick="pick('${Q.key}','${o.v}')">${o.t}${o.s ? `<small>${o.s}</small>` : ''}</button>`;
  });
  stepsEl.innerHTML = h;
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
}
function pick(k, v) {
  answers[k] = v;
  const V = visible();
  if (step < V.length - 1) { step++; render(); }
  else finish();
}
function back() { if (step > 0) { step--; render(); } }

let allPicks = [], sortMode = 'value', showAll = false, meta = {};

function sortedPicks() {
  const p = [...allPicks];
  if (sortMode === 'cheapest') p.sort((a, b) => a.price - b.price);
  else if (sortMode === 'stability') p.sort((a, b) => (b.stability - a.stability) || (a.price - b.price));
  else p.sort((a, b) => (b.performance / b.price) - (a.performance / a.price));
  return p;
}
function setSort(m) { sortMode = m; showAll = false; renderResults(); }
function setTab(t) { activeTab = t; showAll = false; renderResults(); }
let activeTab = 'modems';

function sortButtonsHTML() {
  return `<div class="sortrow">
    <button class="sort${sortMode === 'value' ? ' on' : ''}" onclick="setSort('value')">💪 Best value</button>
    <button class="sort${sortMode === 'stability' ? ' on' : ''}" onclick="setSort('stability')">🛡️ Most reliable</button>
    <button class="sort${sortMode === 'cheapest' ? ' on' : ''}" onclick="setSort('cheapest')">💲 Cheapest</button>
  </div>`;
}

function bestCombo() {
  const ordered = sortedPicks();
  return {
    m: ordered.find(p => p.type === 'modem'),
    rt: ordered.find(p => p.type === 'router' || p.type === 'mesh')
  };
}

function comboCardHTML() {
  const { m, rt } = bestCombo();
  if (!m || !rt) return '';
  const total = m.price + rt.price;
  const saveBit = meta.fee > 0 ? ` <span class="permo">— saves you $${meta.fee * 36 - total} over 3 years</span>` : '';
  const kind = sortMode === 'cheapest' ? 'cheapest' : sortMode === 'stability' ? 'most reliable' : 'highest-value';
  return `<div class="card combo"><span class="rank">⭐ OUR COMBO PICK</span>
    <h3>${m.name} + ${rt.name}</h3>
    <div class="price">$${total}${saveBit}</div>
    <p class="why">Our ${kind} modem paired with our ${kind} router for your home. Buy both, ditch the rental, done.</p></div>`;
}

function tabButtonsHTML(modems, routers) {
  return `<div class="sortrow">
    <button class="sort${activeTab === 'modems' ? ' on' : ''}" onclick="setTab('modems')">🔌 Modems (${modems.length})</button>
    <button class="sort${activeTab === 'routers' ? ' on' : ''}" onclick="setTab('routers')">📶 Routers (${routers.length})</button>
  </div>`;
}

function listHTML(picks) {
  const shown = showAll ? picks : picks.slice(0, 5);
  let h = '';
  shown.forEach((p, i) => { h += cardHTML(p, i); });
  if (!showAll && picks.length > 5)
    h += `<button class="more" onclick="showAll=true;renderResults()">Show ${picks.length - 5} more ▼</button>`;
  return h;
}

function cardHTML(p, i) {
  const saveLine = p.saves_over_life > 0
    ? `saves you $${p.saves_over_life} over ${p.life_years} years`
    : `WiFi upgrade — no rental fee on your plan`;
  return `<div class="card"><span class="rank">#${i + 1} ${p.type.replace('_', ' ').toUpperCase()}</span>
    <h3>${p.name}</h3>
    <div class="price">$${p.price} <span class="permo">— ${saveLine}</span></div>
    <p class="why">${p.why}</p>
    ${p.blurb ? `<p class="blurb">${p.blurb}</p>` : ''}</div>`;
}

function renderResults() {
  const r = document.getElementById('results');
  let h = `<h1>Your top <span class="accent">picks</span></h1>
           <p class="sub">${meta.isp} · ${meta.conn} · ~${meta.devices} devices</p>`;
  h += sortButtonsHTML();
  if (meta.setup === 'separate') {
    const modems = sortedPicks().filter(p => p.type === 'modem');
    const routers = sortedPicks().filter(p => p.type === 'router' || p.type === 'mesh');
    h += comboCardHTML();
    h += tabButtonsHTML(modems, routers);
    h += listHTML(activeTab === 'modems' ? modems : routers);
  } else {
    h += listHTML(sortedPicks());
  }
  meta.notes.forEach(n => { h += `<div class="note">${n}</div>`; });
  h += `<button class="restart" onclick="showGuide()">🔧 Guide me through setup</button>`;
  h += `<button class="restart" style="background:#1e293b;color:#cbd5e1;border:2px solid #334155" onclick="location.reload()">↺ Start over</button>`;
  r.innerHTML = h;
  window.scrollTo(0, 0);
}

let guide = null, guideLevel = 'basic', guideMethod = 'online';

let guideFrom = 'results';

// Setup flow: ISP -> gear type -> activation -> (Next) -> instructions
function startSetup() {

function pickGear(ispId) {
  const el = document.getElementById('isp-pick');
  el.innerHTML = `<button class="back" onclick="startSetup()">← Back</button>
    <p class="q">What kind of setup do you have?</p>
    <button class="opt" onclick="guideFrom='isp-pick';setupGear='separate';openGuide('${ispId}')">🔌 Separate modem + router<small>Two boxes. Best performance and reliability — a bit more to manage.</small></button>
    <button class="opt" onclick="guideFrom='isp-pick';setupGear='combo';openGuide('${ispId}')">📦 All-in-one box<small>One box does both. Easiest to set up — but you replace the whole thing at upgrade time.</small></button>`;

async function showGuide() {
  guideFrom = 'results';
  document.getElementById('results').style.display = 'none';

}
async function openGuide(ispId) {
  document.getElementById('isp-pick').style.display = 'none';
  const g = document.getElementById('guide');
  g.style.display = 'block';
  g.innerHTML = `<div class="loading"><span class="dots">Loading your guide</span></div>`;
  guide = await fetch('/api/setup-guide/' + ispId + '?gear=' + setupGear).then(x => x.json());
  meta.isp = guide.isp; meta.isp_id = ispId;
  guideStep = 'activate';
  guideLevel = 'basic';
  guideMethod = (guide.activation.online && guide.activation.online.allowed) ? 'online' : 'phone';
  renderGuide();
}
function renderGuide() {
  if (guideStep === 'activate') renderActivation();
  else renderInstructions();
}
function guideSub() {
  return `${guide.isp} · ${guide.gear === 'combo' ? 'All-in-one box' : 'Separate modem + router'}`;
}
function backTarget() {
  // where the top back button goes from the activation screen
  return guideFrom === 'results' ? 'backFromGuide()' : "pickGear('" + meta.isp_id + "')";
}
function backLabel() {
  return guideFrom === 'results' ? '← Back to picks' : '← Back';
}
function renderActivation() {
  const g = document.getElementById('guide');
  const act = guide.activation;
  let h = `<button class="back" onclick="${backTarget()}">${backLabel()}</button>
    <h1>Activate your <span class="accent">modem</span></h1>
    <p class="sub">${guideSub()}</p>`;
  h += `<div class="sortrow">`;
  if (act.online && act.online.allowed)
    h += `<button class="sort${guideMethod === 'online' ? ' on' : ''}" onclick="guideMethod='online';renderGuide()">🌐 Do it online</button>`;
  h += `<button class="sort${guideMethod === 'phone' ? ' on' : ''}" onclick="guideMethod='phone';renderGuide()">📞 Call them</button></div>`;
  if (guideMethod === 'online' && act.online && act.online.allowed) {
    h += `<div class="have">Go to <strong>${act.online.url}</strong> and follow these steps:</div>`;
    act.online.steps.forEach((s, i) => {
      h += `<div class="gstep"><span class="stepnum">${i + 1}</span><p>${s}</p></div>`;
    });
  } else {
    h += `<div class="have">Call <strong class="bignum">${act.phone.number}</strong><br>Have ready:<br>• ${act.phone.have_ready.join('<br>• ')}</div>`;
  }
  h += `<button class="restart" onclick="guideStep='instructions';stepIdx=0;renderGuide()">Next: setup instructions →</button>`;
  g.innerHTML = h;
  window.scrollTo(0, 0);
}
let stepIdx = 0;
function renderInstructions() {
  const steps = guideLevel === 'basic' ? guide.basic : guide.advanced;
  if (stepIdx >= steps.length) stepIdx = steps.length - 1;
  if (stepIdx < 0) stepIdx = 0;
  const s = steps[stepIdx];
  const g = document.getElementById('guide');
  let h = `<button class="back" onclick="guideStep='activate';renderGuide()">← Back to activation</button>
    <h1>${guideLevel === 'basic' ? 'Basic' : 'Advanced'} <span class="accent">setup</span></h1>
    <p class="sub">${guideSub()} · Step ${stepIdx + 1} of ${steps.length}</p>
    <div class="sortrow">
      <button class="sort${guideLevel === 'basic' ? ' on' : ''}" onclick="guideLevel='basic';stepIdx=0;renderInstructions()">🙂 Basic</button>
      <button class="sort${guideLevel === 'advanced' ? ' on' : ''}" onclick="guideLevel='advanced';stepIdx=0;renderInstructions()">🧰 Advanced</button>
    </div>
    <div class="progress"><i style="width:${Math.round((stepIdx + 1) / steps.length * 100)}%"></i></div>
    <div class="gstep"><span class="stepnum">${stepIdx + 1}</span><div><h3>${s.title}</h3><p>${s.body}</p></div></div>`;
  if (s.video_id && s.video_id !== 'REPLACE_ME')
    h += `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${s.video_id}?start=${s.video_start || 0}&rel=0" title="${s.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  else
    h += `<div class="vid soon">🎥 Walkthrough video coming soon</div>`;
  h += `<div class="sortrow">`;
  if (stepIdx > 0) h += `<button class="sort" onclick="stepIdx--;renderInstructions()">← Back</button>`;
  if (stepIdx < steps.length - 1) h += `<button class="sort on" onclick="stepIdx++;renderInstructions()">Next →</button>`;
  else h += `<button class="sort on" onclick="backHome()">Done ✓</button>`;
  h += `</div>`;
  g.innerHTML = h;
  window.scrollTo(0, 0);
}
function backFromGuide() {
  document.getElementById('guide').style.display = 'none';
  if (guideFrom === 'results') {
    document.getElementById('results').style.display = 'block';
  } else {
    backHome();
  }
  window.scrollTo(0, 0);
}


async function finish() {
  document.getElementById('quiz').style.display = 'none';
  const r = document.getElementById('results');
  r.style.display = 'block';
  r.innerHTML = `<div class="loading"><span class="dots">Finding your gear</span></div>`;
  const payload = { ...answers };
  if (payload.setup === 'one_piece') payload.setup = payload.which_piece || 'router_only';
  delete payload.which_piece;
  const res = await fetch('/api/recommend', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(x => x.json());

  allPicks = res.recommendations;
  meta = { isp: res.isp, conn: res.connection.toUpperCase(), devices: res.estimated_devices,
           headline: res.savings.headline, notes: res.notes.filter(n => n),
           fee: Math.round(res.savings.yearly_rental / 12), setup: payload.setup,
           isp_id: payload.isp };

  renderResults();
}

let laptopRes = null, lshowAll = false, ltwoInOne = false, lbattery = false;
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function currentLaptopPicks() {
  let p = [...laptopRes.recommendations];
  if (lbattery) p.sort((a, b) => (b.snapdragon - a.snapdragon) || (b.score - a.score));
  if (ltwoInOne) p = p.filter(x => x.laptop_category === '2-in-1');
  return p;
}
function archBadge(p) {
  if (p.snapdragon && p.architecture === 'both') return ['Intel or Snapdragon versions', ''];
  if (p.snapdragon) return ['Snapdragon', ''];
  if (p.platform === 'macOS') return ['Apple silicon', ''];
  if (p.platform === 'ChromeOS') return ['Chromebook', 'x86'];
  return ['Intel / AMD', 'x86'];
}
function laptopWhyHTML(p) {
  const bullets = Array.isArray(p.why) ? p.why : [];
  if (!bullets.length) return '';
  return `<details class="setupbox"><summary>💡 Why we picked this laptop</summary>
    <ul class="whylist">${bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul></details>`;
}

  // card front shows the compact summary chips (Build .14).

   ['Storage', p.storage_text, p.storage_short], ['Graphics', p.gpu, p.gpu_short]]
    .forEach(([label, full, short]) => {
      if (full && short && full !== short)

  if (!rows.length) return '';

function laptopCardHTML(p, i, isTop, rankLabel) {

  if (p.display_inches) chips.push(`📺 ${p.display_inches}″ screen`);

  if (p.ram_text || p.ram_short) chips.push('Memory · ' + esc(p.ram_short || p.ram_text));
  if (p.storage_text || p.storage_short) chips.push('Storage · ' + esc(p.storage_short || p.storage_text));

    <p class="why">${esc(p.summary || (Array.isArray(p.why) ? (p.why[0] || '') : p.why) || '')}</p>
    ${p.ecosystem_note ? `<p class="why">🔗 ${esc(p.ecosystem_note)}</p>` : ''}
    ${laptopWhyHTML(p)}
    ${fullSpecsHTML(p)}
    <button class="pairbtn" onclick="openPairing('laptop','${p.id}')">🔌 Find my screen or dock to pair with it</button>

}

function videoEmbedURL(u) {
  if (!u) return '';
  const s = String(u);
  const yt = s.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  if (yt) return 'https://www.youtube-nocookie.com/embed/' + yt[1] + '?rel=0';
  const vm = s.match(/(?:vimeo\.com\/|player\.vimeo\.com\/video\/)(\d+)/);
  if (vm) return 'https://player.vimeo.com/video/' + vm[1];
  return s;
}

      lines.push(`<p class="setupline">🖥️ A saved screen is no longer in the catalog. <button class="sort" onclick="setupRemoveMonitor('${s.id}','${m.id}')">✕ Remove</button></p>`);
    else
      lines.push(`<p class="setupline">🖥️ ${esc(mon.name)} ×${m.qty} — ${mon.price_usd != null ? '$' + mon.price_usd.toLocaleString() + ' each' : 'price not shown (not counted in the total)'} <button class="sort" onclick="setupRemoveMonitor('${s.id}','${m.id}')">✕ Remove</button></p>`);
  });
  return lines.join('');
}
function setupCardHTML(s, comp, cat, withActions) {
  const name = s.name || (comp ? comp.name : 'Saved setup');
  const t = setupTotals(s, comp, cat);
  let totalHTML;
  if (t.computerMissing)
    totalHTML = `<div class="note">No total: the saved computer is no longer in the catalog, so there's nothing current to price against.</div>`;
  else if (t.total == null)
    totalHTML = `<div class="note">No total: the computer's price isn't shown, and we never guess one.</div>`;
  else
    totalHTML = `<div class="have" style="text-align:left">Estimated starting total: <strong>$${t.total.toLocaleString()}</strong><br><span style="font-weight:400">From the prices above, checked Oct 2026. The computer's figure is its starting price${t.missingPrice.length ? '; anything marked "price not shown" is not counted' : ''} — configurations and final prices vary.</span></div>`;
  return `<div class="card"><h3>🧩 ${esc(name)}</h3>
    ${setupLinesHTML(s, comp, cat)}
    ${totalHTML}
    ${withActions ? `<div class="setupactions">
      <button class="sort" onclick="setupOpen('${s.id}')">Open</button>
      <button class="sort" onclick="setupRename('${s.id}')">Rename</button>
      <button class="sort" onclick="setupDuplicate('${s.id}')">Duplicate</button>
      <button class="sort" onclick="setupShare(this,'${s.id}')">Share link</button>
      <button class="sort" onclick="setupPrint('${s.id}')">Print checklist</button>
      <button class="sort" onclick="setupDelete('${s.id}')">Delete</button>
    </div>` : ''}</div>`;
}
let setupReturn = { section: 'home', y: 0 };
let setupResolved = {};
async function openMySetup() {
  const cur = SECTION_IDS.find(x => x !== 'setup' &&
    document.getElementById(x).style.display !== 'none');
  setupReturn = { section: cur || 'home', y: window.scrollY || 0 };
  hideAllSections();
  const el = document.getElementById('setup');
  el.style.display = 'block';
  el.innerHTML = `<div class="loading"><span class="dots">Loading your setups</span></div>`;
  window.scrollTo(0, 0);
  await renderSetupList();
}
function closeMySetup() {
  hideAllSections();
  const el = document.getElementById(setupReturn.section);
  if (el) el.style.display = 'block';
  window.scrollTo(0, setupReturn.y);
}
async function renderSetupList() {
  const el = document.getElementById('setup');
  const cat = await loadSetupCatalog();
  let h = `<button class="back" onclick="closeMySetup()">← Back</button>
    <h1>My <span class="accent">Setup</span></h1>
    <p class="sub">Computers, docks, and screens you've saved on this device. This is not a cart — nothing is reserved or ordered, and prices are re-read from the catalog each time you look.</p>`;
  if (!setupStore.setups.length)
    h += `<div class="note">No saved setups yet — save one from any computer result with the 💾 Save this setup button, and it'll wait for you here.</div>`;
  const sorted = [...setupStore.setups].sort((a, b) => (b.updated || 0) - (a.updated || 0));
  for (const s of sorted) {
    const comp = await resolveComputer(s.computer.kind, s.computer.id);
    setupResolved[s.id] = comp;
    h += setupCardHTML(s, comp, cat, true);
  }
  el.innerHTML = h;
}
async function setupOpen(id) {
  const s = getSetup(id);
  if (!s) return;
  const comp = await resolveComputer(s.computer.kind, s.computer.id);
  if (!comp) { alert('That computer is no longer in the catalog.'); return; }
  if (s.computer.kind === 'laptop') renderModelCard(comp);
  else renderDesktopModelCard(comp);
}
function setupRename(id) {
  const s = getSetup(id);
  if (!s) return;
  const cur = s.name || (setupResolved[id] ? setupResolved[id].name : '');
  const n = prompt('Name this setup:', cur);
  if (n && n.trim()) { s.name = n.trim(); touchSetup(s); renderSetupList(); }
}
function setupDuplicate(id) {
  const s = getSetup(id);
  if (!s) return;
  const copy = JSON.parse(JSON.stringify(s));
  copy.id = newSetupId();
  copy.name = (s.name || (setupResolved[id] ? setupResolved[id].name : 'Setup')) + ' (copy)';
  copy.created = Date.now(); copy.updated = Date.now();
  setupStore.setups.push(copy);
  persistSetups();
  renderSetupList();
}
function setupDelete(id) {
  if (!confirm('Delete this saved setup?')) return;
  setupStore.setups = setupStore.setups.filter(s => s.id !== id);
  if (setupStore.active_id === id) setupStore.active_id = null;
  persistSetups();
  renderSetupList();
}
function setupRemoveDock(id) {
  const s = getSetup(id);
  if (!s) return;
  s.dock_id = null; touchSetup(s); renderSetupList();
}
function setupRemoveMonitor(id, monId) {
  const s = getSetup(id);
  if (!s) return;
  s.monitors = s.monitors.filter(m => m.id !== monId);
  touchSetup(s); renderSetupList();
}
function setupShare(btn, id) {
  const s = getSetup(id);
  if (!s) return;
  const comp = setupResolved[id];
  const url = encodeSetupLink(s, s.name || (comp ? comp.name : 'My setup'));
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => {
      btn.textContent = '✓ Link copied';
      setTimeout(() => { btn.textContent = 'Share link'; }, 2000);
    }, () => prompt('Copy this share link:', url));
  } else prompt('Copy this share link:', url);
}
async function setupPrint(id) {
  const s = getSetup(id);
  if (!s) return;
  const cat = await loadSetupCatalog();
  const comp = await resolveComputer(s.computer.kind, s.computer.id);
  const name = s.name || (comp ? comp.name : 'Saved setup');
  const t = setupTotals(s, comp, cat);
  const rows = [];
  rows.push(comp ? `☐ Computer: ${esc(comp.name)} — from $${comp.price.toLocaleString()}`
                 : '☐ Computer: no longer in the catalog');
  if (s.dock_id) {
    const d = cat.docks[s.dock_id];
    rows.push(d ? `☐ Dock: ${esc(d.name)}${d.price_usd != null ? ' — $' + d.price_usd.toLocaleString() : ' — price not shown'}`
                : '☐ Dock: no longer in the catalog');
  }
  s.monitors.forEach(m => {
    const mon = cat.monitors[m.id];
    rows.push(mon ? `☐ Screen ×${m.qty}: ${esc(mon.name)}${mon.price_usd != null ? ' — $' + mon.price_usd.toLocaleString() + ' each' : ' — price not shown'}`
                  : '☐ Screen: no longer in the catalog');
  });
  if (!s.dock_id && !s.monitors.length)
    rows.push("☐ Add a dock or screens from the pairing flow on this computer's card.");
  document.getElementById('setup').innerHTML = `
    <button class="back no-print" onclick="renderSetupList()">← Back to My Setup</button>
    <div class="printsheet">
      <h2>🧩 ${esc(name)} — setup checklist</h2>
      ${rows.map(r => `<p>${r}</p>`).join('')}
      ${t.total != null
        ? `<p><strong>Estimated starting total: $${t.total.toLocaleString()}</strong> — from prices checked Oct 2026; the computer's figure is a starting price and configurations vary.</p>`
        : '<p>No total shown — a component has no current price.</p>'}
      <p>Saved with ByteMatch. A checklist, not an order: nothing is reserved or purchased.</p>
    </div>
    <button class="pairbtn no-print" onclick="window.print()">🖨️ Print this checklist</button>`;
  window.scrollTo(0, 0);
}
// Share links: ids + quantities + name, in the URL hash only.
function encodeSetupLink(s, displayName) {
  const payload = { n: displayName || '', c: [s.computer.kind, s.computer.id],
                    d: s.dock_id || null,
                    m: s.monitors.map(m => [m.id, m.qty]) };
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return location.origin + location.pathname + '#setup=' + b64;
}
function decodeSetupLink(hash) {
  try {
    const b64 = hash.replace(/^#setup=/, '').replace(/-/g, '+').replace(/_/g, '/');
    const j = JSON.parse(decodeURIComponent(escape(atob(b64))));
    if (!j || !Array.isArray(j.c) || !j.c[1]) return null;
    return { name: j.n || null,
             computer: { kind: j.c[0] === 'desktop' ? 'desktop' : 'laptop', id: j.c[1] },
             dock_id: j.d || null,
             monitors: (Array.isArray(j.m) ? j.m : []).map(([mid, qty]) =>
               ({ id: mid, qty: Math.max(1, Math.min(9, qty | 0 || 1)) })) };
  } catch (e) { return null; }
}
let sharedSetup = null;
async function openSharedSetup(hash) {
  const parsed = decodeSetupLink(hash);
  if (!parsed) return false;
  sharedSetup = parsed;
  setupReturn = { section: 'home', y: 0 };
  hideAllSections();
  const el = document.getElementById('setup');
  el.style.display = 'block';
  el.innerHTML = `<div class="loading"><span class="dots">Loading the shared setup</span></div>`;
  const cat = await loadSetupCatalog();
  const comp = await resolveComputer(parsed.computer.kind, parsed.computer.id);
  const pseudo = { id: '__shared__', name: parsed.name,
                   computer: parsed.computer, dock_id: parsed.dock_id,
                   monitors: parsed.monitors };
  el.innerHTML = `<button class="back" onclick="closeMySetup()">← Back</button>
    <h1>A shared <span class="accent">setup</span></h1>
    <p class="sub">Someone shared this setup with you. Prices and availability are today's catalog data — save a copy and it stays in your own My Setup on this device.</p>
    ${setupCardHTML(pseudo, comp, cat, false)}
    <button class="pairbtn" onclick="sharedSaveCopy()">💾 Save a copy to My Setup</button>`;
  window.scrollTo(0, 0);
  return true;
}
function sharedSaveCopy() {
  if (!sharedSetup) return;
  const s = { id: newSetupId(), name: sharedSetup.name || null,
              computer: sharedSetup.computer, dock_id: sharedSetup.dock_id,
              monitors: sharedSetup.monitors.map(m => ({ id: m.id, qty: m.qty })),
              created: Date.now(), updated: Date.now() };
  setupStore.setups.push(s);
  setupStore.active_id = s.id;
  persistSetups();
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  openMySetup();
}
updateSetupBtn();
if (location.hash && location.hash.indexOf('#setup=') === 0)
  openSharedSetup(location.hash);

// ------------------------------------------------------------- disclaimers
// All the coverage notes and version caveats from across the guides live
// on ONE page, so flows don't end in a stack of blue boxes. Back returns
// to exactly the view (and wizard step) the user came from: we only toggle
// section visibility, so the previous section's DOM and state are intact.
let discReturn = { section: 'home', y: 0 };
async function openDisclaimers() {
  if (!pcGuides) {
    try { pcGuides = await fetch('/api/laptop-guides').then(x => x.json()); }
    catch (e) { /* page still renders its static sections */ }
  }
  const cur = SECTION_IDS.find(id => id !== 'disclaimers' &&
    document.getElementById(id).style.display !== 'none');
  discReturn = { section: cur || 'home', y: window.scrollY || 0 };
  renderDisclaimers();
  hideAllSections();
  document.getElementById('disclaimers').style.display = 'block';
  window.scrollTo(0, 0);
}
function closeDisclaimers() {
  hideAllSections();
  const el = document.getElementById(discReturn.section);
  if (el) el.style.display = 'block';
  window.scrollTo(0, discReturn.y);
}
function discSection(title, items) {
  if (!items || !items.length) return '';
  return `<p class="picks-head">${esc(title)}</p>` +
    items.map(n => `<div class="note">${esc(typeof n === 'string' ? n : (n.detail || n.title || ''))}</div>`).join('');
}
function renderDisclaimers() {
  const el = document.getElementById('disclaimers');
  let h = `<button class="back" onclick="closeDisclaimers()">← Back</button>
    <h1>Disclaimers</h1>
    <p class="sub">The fine print, all in one place: what our data is based on, where it can differ from the screen in front of you, and what we couldn't verify. The guides themselves only keep the notes that change what you should do.</p>`;
  h += discSection('What we don\'t cover yet', [
    "ByteMatch covers whole computers and networking gear — not individual PC parts. We don't work with standalone components like CPUs, graphics cards, motherboards, or cases today. Parts may be added at a later date; when they are, they'll get the same research-first treatment as everything else here.",
  ]);
  h += discSection('Prices & recommendations', [
    "Computer prices (laptops and desktops) are manufacturers' published list prices, checked in October 2026, and are shown as a range — the starting configuration through the highest configuration we could verify. When only a starting price could be verified, that's all we show — no implied maximum. Store prices, sales, and coupons will differ.",
    "We never quote a marketplace seller's price as a model's price, and a computer with no verified manufacturer price is not listed at all. We would rather show fewer computers than invent a number.",
    "Recommendations are ranked from your quiz answers and the manufacturers' published specs for each model. Prices and specs were checked when our catalog was built and can change without notice.",
  ]);
  h += discSection('Networking', [
    "Rental fees and savings figures come from each provider's published equipment fees in our data, checked in October 2026. Promotions, bundles, and regional pricing can change what you actually pay — your own bill is the source of truth.",
    "Modem and router compatibility is checked against each provider's published approved-device information. A provider can change its list at any time, so confirm on the provider's site before you buy.",
  ]);
  const sg = pcGuides && pcGuides.setup_guides;
  if (sg && sg.os_flows) {
    const labels = { windows_11: 'Setup guides — Windows 11', macos: 'Setup guides — macOS', chromeos: 'Setup guides — ChromeOS' };
    Object.keys(labels).forEach(k => {
      if (sg.os_flows[k]) h += discSection(labels[k], sg.os_flows[k].disclaimers);
    });
  }
  const par = pcGuides && pcGuides.parental_controls;
  if (par && par.platforms) {
    const all = [];
    Object.keys(par.platforms).forEach(k => {
      (par.platforms[k].disclaimers || []).forEach(n => all.push(n));
    });
    h += discSection('Parental controls', all);
  }
  el.innerHTML = h;
}

fetch('/api/isps').then(x => x.json()).then(d => { isps = d; });
